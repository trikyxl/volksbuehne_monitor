# Place this file at:  .github/workflows/monitor.yml  in your repo.
name: Volksbad monitor

on:
  schedule:
    # Every 5 minutes (cron is in UTC). GitHub may delay scheduled runs a
    # few minutes under load - fine for free pool slots. Once you learn the
    # daily release time you can narrow this, e.g. "*/5 8-11 * * *" to only
    # poll 08:00-11:59 UTC and save both server load and your Actions minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a test run manually from the Actions tab

concurrency:
  group: volksbad-monitor
  cancel-in-progress: false

permissions:
  contents: write   # needed so the run can commit state.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BOOKING_URL: ${{ vars.BOOKING_URL }}
          TARGET_DATES: ${{ vars.TARGET_DATES }}
        run: python monitor.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update slot state"
            git push
          fi
