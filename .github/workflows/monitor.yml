# Place this file at:  .github/workflows/monitor.yml  in your repo.
name: Volksbad monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: volksbad-monitor
  cancel-in-progress: true   # don't let overlapping runs race each other

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # Load the state saved by the previous run (if any) from the cache.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: volksbad-state-${{ github.run_id }}
          restore-keys: |
            volksbad-state-

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BOOKING_URL: ${{ vars.BOOKING_URL }}
          TARGET_DATES: ${{ vars.TARGET_DATES }}
        run: python monitor.py

      # Save the updated state to the cache for the next run.
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: volksbad-state-${{ github.run_id }}
